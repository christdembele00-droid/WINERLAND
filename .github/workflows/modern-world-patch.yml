name: Apply Modern World Renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[modern-world-patch]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch web game renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/GameScreen.web.js')
          s = p.read_text(encoding='utf-8')
          old = "import { GAME_MODES, ROBOT_ARCHETYPES } from '../game/hunterSystems';"
          new = old + "\nimport ModernWorld from '../game/ModernWorld.web';"
          if "ModernWorld from '../game/ModernWorld.web'" not in s:
              s = s.replace(old, new, 1)
          old_world = "<World position={position} remotePlayers={remotePlayers} robots={robots} />"
          if old_world not in s:
              raise SystemExit('Expected World render was not found; refusing to modify the file.')
          s = s.replace(old_world, "<ModernWorld position={position} remotePlayers={remotePlayers} robots={robots} />", 1)
          old_canvas = "<Canvas shadows camera={{ position: [0, 8.5, 18], fov: 55 }} style={styles.canvas}>"
          new_canvas = "<Canvas shadows dpr={[1, 1.5]} gl={{ antialias: false, powerPreference: 'high-performance' }} camera={{ position: [0, 8.5, 18], fov: 55 }} style={styles.canvas}>"
          if old_canvas in s:
              s = s.replace(old_canvas, new_canvas, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit renderer integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/GameScreen.web.js
          git commit -m 'feat: integrate modern Nexus City renderer [modern-world-patch]' || exit 0
          git push
